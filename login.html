<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід / BoardGame Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <a href="index.html" class="brand">BoardGame Hub</a>
            <nav id="navbar-auth"></nav>
        </div>
    </header>

    <main class="container auth-container">
        <div class="auth-card">
            <h2>Вхід</h2>
            <p class="auth-subtext">Введіть свій логін і пароль для доступу</p>

            <div id="alert-box" class="alert-box hidden"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Ім'я користувача (username)</label>
                    <input type="text" id="username" required placeholder="Ваш username">
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn btn-primary btn-block">Увійти</button>
            </form>

            <p class="auth-footer-text">
                Ще не маєте акаунта? <a href="register.html">Зареєструватися</a>
            </p>
        </div>
    </main>

    <script src="auth.js"></script>
    <script>
        if (isAuthenticated()) {
            window.location.href = 'index.html';
        }

        const loginForm = document.getElementById('login-form');
        const alertBox = document.getElementById('alert-box');

        function showAlert(msg) {
            alertBox.textContent = msg;
            alertBox.className = 'alert-box alert-error';
            alertBox.classList.remove('hidden');
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const payload = {
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch(`${API_BASE}/auth/login/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    setTokens(data.access, data.refresh);
                    
                    localStorage.setItem('user_data', JSON.stringify({ username: payload.username }));

                    const urlParams = new URLSearchParams(window.location.search);
                    const nextUrl = urlParams.get('next');
                    window.location.href = nextUrl ? decodeURIComponent(nextUrl) : 'index.html';
                } else {
                    showAlert(data.message || 'Невірне ім\'я користувача або пароль.');
                }
            } catch (err) {
                showAlert('Мережева помилка. Перевірте, чи працює бекенд.');
            }
        });
    </script>
</body>
</html>
