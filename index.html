<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог ігор / BoardGame Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <a href="index.html" class="brand">BoardGame Hub</a>
            <nav id="navbar-auth"></nav>
        </div>
    </header>

    <main class="container">
        <div class="section-top">
            <div>
                <h1>Каталог настільних ігор</h1>
            </div>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Пошук гри...">
                <button id="search-btn" class="btn btn-secondary">Знайти</button>
            </div>
        </div>

        <div id="games-container" class="games-grid">
            <p class="loading-text">Завантаження каталогу...</p>
        </div>
    </main>

    <script src="auth.js"></script>
    <script>
        const gamesContainer = document.getElementById('games-container');
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');

        async function fetchGames(search = '') {
            gamesContainer.innerHTML = '<p class="loading-text">Оновлення списку...</p>';
            try {
                const url = search ? `${API_BASE}/games/?search=${encodeURIComponent(search)}` : `${API_BASE}/games/`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Помилка завантаження каталогу');
                const games = await response.json();
                renderGames(games);
            } catch (err) {
                gamesContainer.innerHTML = `<p class="alert-error">${err.message}</p>`;
            }
        }

        function renderGames(games) {
            if (!games || games.length === 0) {
                gamesContainer.innerHTML = '<p>Ігор не знайдено.</p>';
                return;
            }
            gamesContainer.innerHTML = games.map(g => `
                <div class="game-card">
                    <h3>${g.title}</h3>
                    <div class="game-price">${g.price} грн</div>
                    <div class="game-meta">
                        <span>${g.min_players}-${g.max_players} гравців</span> | 
                        <span>${g.play_time_minutes} хв</span> | 
                        <span>${g.rating}</span>
                    </div>
                    <p class="game-desc">${g.description ? g.description.slice(0, 100) + '...' : ''}</p>
                </div>
            `).join('');
        }

        searchBtn.addEventListener('click', () => fetchGames(searchInput.value.trim()));
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') fetchGames(searchInput.value.trim());
        });

        fetchGames();
    </script>
</body>
</html>
